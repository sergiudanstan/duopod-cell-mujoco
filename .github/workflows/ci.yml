name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; no job here needs to write anything.
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install ruff (hash-pinned)
        run: python -m pip install --require-hashes -r .github/requirements-ci.lock
      - name: Ruff, syntax errors and undefined names only
        # The existing code is not written to ruff's wider default rule set, so the
        # check is scoped to rules that find real bugs: syntax errors (E9), invalid
        # comparisons and string formats (F63, F7) and undefined names (F82).
        run: ruff check --isolated --select E9,F63,F7,F82 .

  test:
    name: physics tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Install from uv.lock (fails if the lock is out of date)
        run: uv sync --locked
      - name: Physics checks (headless, no rendering)
        run: uv run pytest -q
      - name: The collision check must fail when the escapement interlock is removed
        # A guard against a test that has gone dead: with --perturb the held carton
        # touches another carton, so test_no_carton_collision_while_held has to fail.
        run: |
          if uv run pytest -q --perturb -k test_no_carton_collision_while_held; then
            echo "the collision test still passes with the interlock removed" >&2
            exit 1
          fi

  audit:
    name: security audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install audit tooling (hash-pinned)
        run: python -m pip install --require-hashes -r .github/requirements-ci.lock
      - name: Known vulnerabilities in the CI toolchain
        run: pip-audit --strict --no-deps -r .github/requirements-ci.lock --progress-spinner off
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Known vulnerabilities in the locked runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/runtime.txt"
          pip-audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/runtime.txt" --progress-spinner off
      - name: Audit the workflows themselves
        run: zizmor --format plain .github/workflows/
